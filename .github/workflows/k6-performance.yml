name: Performance Tests

permissions:
  contents: read

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which test to run'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - browser
          - all

jobs:
  load-test:
    name: HTTP Load Test
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'load' ||
      github.event.inputs.test_type == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start app
        run: |
          npm run build
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Create results directory
        run: mkdir -p performance/results

      - name: Bundle k6 test
        run: |
          npx esbuild performance/load/shop-load.ts \
            --bundle \
            --platform=node \
            --target=es2020 \
            --outfile=performance/load/shop-load.js

      - name: Run load test
        run: |
          k6 run \
            --out json=performance/results/load-results.json \
            performance/load/shop-load.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-results
          path: performance/results/
          retention-days: 14