# k6-performance.yml
#
# This workflow runs your k6 performance tests in CI.
#
# It's triggered in two ways:
#   1. On a schedule (nightly) — catches regressions that creep in over time
#   2. Manually via workflow_dispatch — so you can run it on demand
#
# LEARNING GOAL: Understand how performance testing fits into a CI pipeline.
#
# TODO items are marked clearly — fill them in as you build out the tests.

name: Performance Tests

permissions:
  contents: read

on:
  schedule:
    # Runs at 02:00 UTC every night.
    # Cron format: minute hour day month weekday
    - cron: '0 2 * * *'

  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI.
    # Useful while you're developing the tests.
    inputs:
      test_type:
        description: 'Which test to run'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - browser
          - all

jobs:
  # ------------------------------------------------------------------
  # JOB 1: HTTP Load Test
  # ------------------------------------------------------------------
  load-test:
    name: HTTP Load Test
    runs-on: ubuntu-latest
    # Only run if triggered manually with 'load' or 'all', OR on schedule
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'load' ||
      github.event.inputs.test_type == 'all'

    steps:
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Create results directory
        run: mkdir -p performance/results

      - name: Bundle k6 test
        run: |
          npm install --save-dev esbuild
          npx esbuild performance/load/shop-load.ts \
            --bundle \
            --platform=node \
            --target=es2020 \
            --outfile=performance/load/shop-load.js

      - name: Run load test
        run: |
          k6 run \
            --out json=performance/results/load-results.json \
            performance/load/shop-load.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-results
          path: performance/results/
          retention-days: 14