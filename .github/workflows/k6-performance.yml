# k6-performance.yml
#
# This workflow runs your k6 performance tests in CI.
#
# It's triggered in two ways:
#   1. On a schedule (nightly) — catches regressions that creep in over time
#   2. Manually via workflow_dispatch — so you can run it on demand
#
# LEARNING GOAL: Understand how performance testing fits into a CI pipeline.
#
# TODO items are marked clearly — fill them in as you build out the tests.

name: Performance Tests

permissions:
  contents: read

on:
  schedule:
    # Runs at 02:00 UTC every night.
    # Cron format: minute hour day month weekday
    - cron: '0 2 * * *'

  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI.
    # Useful while you're developing the tests.
    inputs:
      test_type:
        description: 'Which test to run'
        required: true
        default: 'load'
        type: choice
        options:
          - load
          - browser
          - all

jobs:
  # ------------------------------------------------------------------
  # JOB 1: HTTP Load Test
  # ------------------------------------------------------------------
  load-test:
    name: HTTP Load Test
    runs-on: ubuntu-latest
    # Only run if triggered manually with 'load' or 'all', OR on schedule
    if: >
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'load' ||
      github.event.inputs.test_type == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO: Add a step to start your Next.js app in the background.
      # Hint: You'll need to install dependencies and run `npm run build && npm start &`
      # then wait for the server to be ready before k6 runs.
      # Look into the `wait-on` npm package for this.

      - name: Install dependencies and start server
        run: |
          npm ci
          npm run build
          npm start &
          npx wait-on http://localhost:3000

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run load test
        run: |
          k6 run \
            --out json=performance/results/load-results.json \
            performance/load/shop-load.ts
        env:
          BASE_URL: http://localhost:3000
          # TODO: When you have a deployed URL, pass it as a secret:
          # BASE_URL: ${{ secrets.STAGING_URL }}

      # TODO: Upload the results file as a GitHub artifact so you can
      # download and inspect it after the run.
      # Hint: Use actions/upload-artifact@v4